<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, height=720">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #line {
    position: fixed;
    left: 50%;
    bottom: 8%;
    width: 88%;
    transform: translateX(-50%);
    text-align: center;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
    font-weight: 900;
    font-size: clamp(30px, 4.6vw, 64px);
    line-height: 1.08;
    letter-spacing: 0.015em;
    color: #fff;
    -webkit-text-stroke: 8px #000;
    paint-order: stroke fill;
    text-shadow:
      0 0 1px #000,
      0 0 3px #000,
      0 5px 20px rgba(0, 0, 0, 0.95),
      0 0 46px rgba(0, 0, 0, 0.8);
    opacity: 0;
    will-change: opacity;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="line">The door was never locked.</div>
<script>
(() => {
  'use strict';

  const DURATION = 30;
  const IMAGE_AT = 15;
  const IMAGE_FADE = 0.9;
  const REF_W = 1280;
  const REF_H = 720;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const line = document.getElementById('line');

  let w = REF_W;
  let h = REF_H;
  let dpr = 1;
  let grain = null;

  const hallway = new Image();
  hallway.src = 'assets/hallway.jpg';
  let hallwayReady = false;
  hallway.onload = () => { hallwayReady = true; };

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  };
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };

  function resize() {
    w = Math.max(1, window.innerWidth);
    h = Math.max(1, window.innerHeight);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function buildGrain() {
    const size = 256;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    const data = g.createImageData(size, size);
    let seed = 0x2f6e2b1;
    for (let i = 0; i < data.data.length; i += 4) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      const v = seed >>> 24;
      data.data[i] = 255;
      data.data[i + 1] = 255;
      data.data[i + 2] = 255;
      data.data[i + 3] = v < 44 ? v * 3 : 0;
    }
    g.putImageData(data, 0, 0);
    grain = c;
  }

  // 0 is a dead bulb, 1 is a steady one. Derived only from t, so any frame can
  // be rendered alone, in any order.
  function flicker(t) {
    const k = Math.floor(t * 24);
    const base = 0.80 + 0.10 * Math.sin(t * 10.3) + 0.06 * Math.sin(t * 21.7 + 1.3);
    let f = base * (0.84 + 0.16 * hash(k * 1.31 + 0.4));
    if (hash(k * 2.17 + 8.0) < 0.055) f *= 0.30;
    if (hash(k * 0.79 + 41.0) > 0.986) f *= 0.14;
    return clamp(f, 0.05, 1);
  }

  function drawCover(img) {
    const s = Math.max(w / img.width, h / img.height);
    const dw = img.width * s;
    const dh = img.height * s;
    ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }

  function drawDark(t) {
    const f = flicker(t);

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#020304';
    ctx.fillRect(0, 0, w, h);

    // A pool of sodium-green light that dies and comes back with the tube.
    const cx = w * 0.5;
    const cy = h * 0.44;
    const glow = ctx.createRadialGradient(cx, cy, h * 0.02, cx, cy, Math.max(w, h) * 0.62);
    glow.addColorStop(0, `rgba(82, 112, 104, ${0.12 + 0.20 * f})`);
    glow.addColorStop(0.45, `rgba(38, 58, 55, ${0.08 + 0.14 * f})`);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    // A door at the end of the corridor, just short of readable.
    const dw = w * 0.15;
    const dh = h * 0.56;
    const dx = cx - dw / 2;
    const dy = h * 0.19;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
    ctx.fillRect(dx, dy, dw, dh);
    ctx.strokeStyle = `rgba(126, 164, 150, ${0.05 + 0.07 * f})`;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(dx + 0.5, dy + 0.5, dw - 1, dh - 1);
    ctx.fillStyle = `rgba(150, 184, 168, ${0.03 + 0.10 * f})`;
    ctx.fillRect(dx + dw * 0.18, dy + dh - 2, dw * 0.64, 1.5);

    // Floor sinking into black.
    const floor = ctx.createLinearGradient(0, h * 0.68, 0, h);
    floor.addColorStop(0, 'rgba(0, 0, 0, 0)');
    floor.addColorStop(0.55, 'rgba(2, 5, 5, 0.55)');
    floor.addColorStop(1, 'rgba(0, 0, 0, 0.96)');
    ctx.fillStyle = floor;
    ctx.fillRect(0, h * 0.66, w, h * 0.34);

    // Torn bands of darkness that move with the tube.
    const frame = Math.floor(t * 30);
    for (let i = 0; i < 4; i++) {
      if (hash(frame * 3.7 + i * 9.1) > 0.52) {
        const y = hash(frame * 1.9 + i * 7.3) * h;
        const bh = 2 + hash(frame * 4.1 + i) * 16;
        ctx.fillStyle = `rgba(0, 0, 0, ${0.16 + 0.34 * hash(frame + i * 3.3)})`;
        ctx.fillRect(0, y, w, bh);
      }
    }

    if (grain) {
      const ox = Math.floor(hash(frame * 1.7) * 256);
      const oy = Math.floor(hash(frame * 2.3 + 5) * 256);
      ctx.globalAlpha = 0.30 + 0.30 * f;
      for (let x = -ox; x < w; x += 256) {
        for (let y = -oy; y < h; y += 256) ctx.drawImage(grain, x, y);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawHallway(t) {
    const a = smoothstep(IMAGE_AT, IMAGE_AT + IMAGE_FADE, t);

    // During the fade keep the corridor under the hallway, so the switch is a
    // dissolve, not a dip to black at exactly IMAGE_AT.
    if (a < 1) {
      drawDark(t);
    } else {
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
    }
    if (!hallwayReady) return;

    ctx.globalAlpha = a;
    ctx.filter = 'brightness(0.64) contrast(1.12) saturate(0.58)';
    drawCover(hallway);
    ctx.filter = 'none';

    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(62, 104, 92, 0.55)';
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';

    const v = ctx.createRadialGradient(w / 2, h / 2, h * 0.20, w / 2, h / 2, Math.max(w, h) * 0.75);
    v.addColorStop(0, 'rgba(0, 0, 0, 0)');
    v.addColorStop(0.62, 'rgba(0, 0, 0, 0.22)');
    v.addColorStop(1, 'rgba(0, 0, 0, 0.88)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }

  function updateLine(t) {
    const fadeIn = smoothstep(1.6, 6.4, t);
    const fadeOut = 1 - smoothstep(13.4, 14.9, t);
    const op = fadeIn * fadeOut;
    const jitter = 0.94 + 0.06 * flicker(t);
    line.style.opacity = (op * jitter).toFixed(3);
    line.style.transform = `translateX(-50%) scale(${(1 + 0.012 * op).toFixed(4)})`;
  }

  function frame(t) {
    const time = clamp(t, 0, DURATION - 0.0001);
    if (time < IMAGE_AT) drawDark(time);
    else drawHallway(time);
    updateLine(time);
  }

  const ready = (async () => {
    resize();
    buildGrain();
    try { await hallway.decode(); } catch (error) { /* the dark half still renders */ }
  })();

  window.film = {
    duration: DURATION,
    width: REF_W,
    height: REF_H,
    ready,
    frame,
  };
})();
</script>
</body>
</html>
