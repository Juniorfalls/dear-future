name: Render Cinematic Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Episode topic, e.g. The Fall of Rome"
        required: false
        default: "The History of Rome"
      images:
        description: "Image source: auto (committed stills, else Pollinations.ai) or openai"
        type: choice
        options: [auto, pollinations, openai]
        default: auto
  push:
    branches: [main]
    paths:
      - "remotion/**"
      - "generate_video.py"
      - "generate_script.py"
      - "generate_voice.py"
      - "requirements.txt"
      - ".github/workflows/render.yml"

env:
  TOPIC: ${{ github.event.inputs.topic || 'The History of Rome' }}
  IMAGES: ${{ github.event.inputs.images || 'auto' }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Cache Remotion browser
        uses: actions/cache@v6
        with:
          path: remotion/node_modules/.remotion
          key: ${{ runner.os }}-remotion-browser-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-remotion-browser-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The committed scenes.json already carries the stills, narration and
      # per-shot timings, so a normal render never regenerates it (that would
      # drop the voice blocks). Generation is the bootstrap path, and it needs
      # the voice environment anyway; see README "Voiceover".
      - name: Generate scenes if the repo has none
        if: ${{ !hashFiles('remotion/data/scenes.json') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_video.py "$TOPIC" --images "$IMAGES"

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci --no-audit --no-fund

      - name: Render cinematic video
        working-directory: remotion
        run: node render.js

      - name: Upload video
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-video
          path: |
            remotion/out/cinematic_video.mp4
            remotion/data/scenes.json
          if-no-files-found: error
