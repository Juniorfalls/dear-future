name: Render Cinematic Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "remotion/**"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Cache Remotion browser
        uses: actions/cache@v6
        with:
          path: remotion/node_modules/.remotion
          key: ${{ runner.os }}-remotion-browser-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-remotion-browser-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Render cinematic video
        run: node render.js

      - name: Upload video
        uses: actions/upload-artifact@v7
        with:
          name: cinematic-video
          path: remotion/out/cinematic_video.mp4
          if-no-files-found: error
