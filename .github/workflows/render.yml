name: Render Before You Episode

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Thing being reviewed, e.g. iPhone 15"
        required: false
        default: "iPhone 15"
      format:
        description: "Episode angle"
        type: choice
        options: [buy, play, watch]
        default: buy
      clips:
        description: "Background clips (3-5)"
        default: "4"
      test:
        description: "Use public Mixkit clips instead of the Pexels API"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "remotion/**"
      - "fetch_media.py"
      - "requirements.txt"
      - ".github/workflows/render.yml"

env:
  TOPIC: ${{ github.event.inputs.topic || 'iPhone 15' }}
  FORMAT: ${{ github.event.inputs.format || 'buy' }}
  CLIPS: ${{ github.event.inputs.clips || '4' }}
  TEST_MEDIA: ${{ github.event.inputs.test || 'false' }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Cache Remotion browser
        uses: actions/cache@v6
        with:
          path: remotion/node_modules/.remotion
          key: ${{ runner.os }}-remotion-browser-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-remotion-browser-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch footage and build scenes
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ "$TEST_MEDIA" = "true" ] || [ -z "$PEXELS_API_KEY" ]; then
            echo "No Pexels key (or test requested): using public Mixkit clips."
            python fetch_media.py "$TOPIC" --format "$FORMAT" --clips "$CLIPS" --test
          else
            python fetch_media.py "$TOPIC" --format "$FORMAT" --clips "$CLIPS"
          fi

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm ci --no-audit --no-fund

      - name: Render episode
        working-directory: remotion
        run: node render.js

      - name: Upload video
        uses: actions/upload-artifact@v7
        with:
          name: before-you-video
          path: |
            remotion/out/cinematic_video.mp4
            remotion/data/scenes.json
            remotion/public/episodes/**/credits.json
          if-no-files-found: error
