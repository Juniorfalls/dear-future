<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';

  const DURATION = 30;
  const REF_W = 1920;
  const REF_H = 1080;
  const CUES = [
    { start: 0.24, end: 2.371, text: '3:07 AM. No cars for an hour.' },
    { start: 3.24, end: 5.237, text: 'Then the door chimed.' },
    { start: 6.3, end: 8.403, text: 'But nobody came in.' },
    { start: 10.24, end: 11.942, text: "Don't look at it." },
    { start: 13.24, end: 15.14, text: 'The line was dead.' },
    { start: 16.3, end: 18.443, text: 'It was already inside.' },
    { start: 20.24, end: 22.013, text: 'Hold your breath.' },
    { start: 23.24, end: 25.672, text: 'It only moves in the dark.' },
    { start: 26.3, end: 28.672, text: 'Mara was never found.' },
  ];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: true });
  let w = REF_W, h = REF_H;
  let grain = null;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const smoothstep = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const hash = (n) => {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  };

  function resize() {
    w = Math.max(1, window.innerWidth);
    h = Math.max(1, window.innerHeight);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function buildGrain() {
    const size = 256;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    const data = g.createImageData(size, size);
    let seed = 0x2f6e2b1;
    for (let i = 0; i < data.data.length; i += 4) {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      const v = seed >>> 24;
      data.data[i] = 255;
      data.data[i + 1] = 255;
      data.data[i + 2] = 255;
      data.data[i + 3] = v < 34 ? v * 3 : 0;
    }
    g.putImageData(data, 0, 0);
    grain = c;
  }

  // Same deterministic flicker as the standalone test: a hash of 1/24 s.
  function flicker(t) {
    const k = Math.floor(t * 24);
    const base = 0.80 + 0.10 * Math.sin(t * 10.3) + 0.06 * Math.sin(t * 21.7 + 1.3);
    let f = base * (0.84 + 0.16 * hash(k * 1.31 + 0.4));
    if (hash(k * 2.17 + 8.0) < 0.055) f *= 0.30;
    if (hash(k * 0.79 + 41.0) > 0.986) f *= 0.14;
    return clamp(f, 0.05, 1);
  }

  function drawAtmosphere(t) {
    const f = flicker(t);
    const frame = Math.floor(t * 30);

    // A light dark veil, not an opaque corridor: the dummy colour must show.
    ctx.fillStyle = `rgba(0,0,0,${(0.03 + 0.13 * (1 - f)).toFixed(3)})`;
    ctx.fillRect(0, 0, w, h);
    if (hash(frame * 1.73 + 2) < 0.045) {
      ctx.fillStyle = 'rgba(0,0,0,0.38)';
      ctx.fillRect(0, 0, w, h);
    }

    // Cold wash.
    ctx.fillStyle = 'rgba(10,38,34,0.10)';
    ctx.fillRect(0, 0, w, h);

    // Dark bands sliding with the bulb.
    for (let i = 0; i < 3; i++) {
      if (hash(frame * 3.7 + i * 9.1) > 0.62) {
        const y = hash(frame * 1.9 + i * 7.3) * h;
        const bh = 2 + hash(frame * 4.1 + i) * 22;
        ctx.fillStyle = `rgba(0,0,0,${0.08 + 0.20 * hash(frame + i * 3.3)})`;
        ctx.fillRect(0, y, w, bh);
      }
    }

    if (grain) {
      const ox = Math.floor(hash(frame * 1.7) * 256);
      const oy = Math.floor(hash(frame * 2.3 + 5) * 256);
      ctx.globalAlpha = 0.20 + 0.20 * f;
      for (let x = -ox; x < w; x += 256) {
        for (let y = -oy; y < h; y += 256) ctx.drawImage(grain, x, y);
      }
      ctx.globalAlpha = 1;
    }

    const v = ctx.createRadialGradient(w / 2, h / 2, h * 0.24, w / 2, h / 2, Math.max(w, h) * 0.76);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(0.62, 'rgba(0,0,0,0.14)');
    v.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, w, h);
  }

  function wrap(text, maxWidth, font) {
    ctx.font = font;
    const words = text.split(/\s+/);
    const lines = [];
    let line = '';
    for (const word of words) {
      const next = line ? line + ' ' + word : word;
      if (line && ctx.measureText(next).width > maxWidth) {
        lines.push(line);
        line = word;
      } else {
        line = next;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawCue(t) {
    const cue = CUES.find((c) => t >= c.start && t < c.end);
    if (!cue) return;
    const fade = Math.min(0.18, (cue.end - cue.start) * 0.25);
    const opacity = smoothstep(cue.start, cue.start + fade, t)
      * (1 - smoothstep(cue.end - fade, cue.end, t));
    if (opacity <= 0) return;

    const fs = Math.round(h * 0.064);
    const font = `900 ${fs}px Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif`;
    const lines = wrap(cue.text, w * 0.84, font);
    const lineHeight = fs * 1.04;
    const baseY = h * 0.855 - (lines.length - 1) * lineHeight;

    ctx.save();
    ctx.globalAlpha = opacity * (0.94 + 0.06 * flicker(t));
    ctx.font = font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#fff';
    ctx.lineWidth = Math.max(6, fs * 0.19);
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = fs * 0.26;
    lines.forEach((line, i) => {
      const y = baseY + i * lineHeight;
      ctx.strokeText(line, w / 2, y);
      ctx.fillText(line, w / 2, y);
    });
    ctx.restore();
  }

  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    if (t >= 0 && t < DURATION) {
      drawAtmosphere(t);
      drawCue(t);
    }
  }

  resize();
  buildGrain();
  window.film = {
    duration: DURATION,
    width: REF_W,
    height: REF_H,
    ready: document.fonts.ready,
    frame,
  };
})();
</script>
</body>
</html>
