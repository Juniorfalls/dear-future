<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Dummy timeline — nine hard cuts</title>
<style>
  .shot {
    object-fit: cover;
    filter: contrast(1.2) hue-rotate(-10deg) saturate(0.86) brightness(0.94);
  }
</style>
</head>
<body>

<!-- Overlay first: its pictures are on top of the footage. -->
<section>
  <iframe id="story" src="story.html" at="0"
          style="left: 0; top: 0; width: 1920px; height: 1080px"></iframe>
</section>

<!--
  Nine 3 s dummy clips. The 4 s shots play their clip at speed 0.75, so the
  three-second source fills the four-second slot exactly.
-->
<section>
  <video id="shot-01" src="assets/clips/shot-01.mp4#t=0,3" at="0.000"  speed="1"    volume="0" class="shot" style="left:0;top:0;width:1920px;height:1080px"></video>
  <video id="shot-02" src="assets/clips/shot-02.mp4#t=0,3" at="3.000"  speed="1"    volume="0" class="shot" style="left:0;top:0;width:1920px;height:1080px"></video>
  <video id="shot-03" src="assets/clips/shot-03.mp4#t=0,3" at="6.000"  speed="0.75" volume="0" class="shot" style="left:0;top:0;width:1920px;height:1080px"></video>
  <video id="shot-04" src="assets/clips/shot-04.mp4#t=0,3" at="10.000" speed="1"    volume="0" class="shot" style="left:0;top:0;width:1920px;height:1080px"></video>
  <video id="shot-05" src="assets/clips/shot-05.mp4#t=0,3" at="13.000" speed="1"    volume="0" class="shot" style="left:0;top:0;width:1920px;height:1080px"></video>
  <video id="shot-06" src="assets/clips/shot-06.mp4#t=0,3" at="16.000" speed="0.75" volume="0" class="shot" style="left:0;top:0;width:1920px;height:1080px"></video>
  <video id="shot-07" src="assets/clips/shot-07.mp4#t=0,3" at="20.000" speed="1"    volume="0" class="shot" style="left:0;top:0;width:1920px;height:1080px"></video>
  <video id="shot-08" src="assets/clips/shot-08.mp4#t=0,3" at="23.000" speed="1"    volume="0" class="shot" style="left:0;top:0;width:1920px;height:1080px"></video>
  <video id="shot-09" src="assets/clips/shot-09.mp4#t=0,3" at="26.000" speed="0.75" volume="0" class="shot" style="left:0;top:0;width:1920px;height:1080px"></video>
</section>

<!-- Voice lines, one per shot. -->
<section>
  <audio id="vo-01" src="assets/audio/shot-01.wav#t=0,1.581" at="0.000"  volume="1"></audio>
  <audio id="vo-02" src="assets/audio/shot-02.wav#t=0,1.447" at="3.000"  volume="1"></audio>
  <audio id="vo-03" src="assets/audio/shot-03.wav#t=0,1.553" at="6.000"  volume="1"></audio>
  <audio id="vo-04" src="assets/audio/shot-04.wav#t=0,1.152" at="10.000" volume="1"></audio>
  <audio id="vo-05" src="assets/audio/shot-05.wav#t=0,1.350" at="13.000" volume="1"></audio>
  <audio id="vo-06" src="assets/audio/shot-06.wav#t=0,1.593" at="16.000" volume="1"></audio>
  <audio id="vo-07" src="assets/audio/shot-07.wav#t=0,1.223" at="20.000" volume="1"></audio>
  <audio id="vo-08" src="assets/audio/shot-08.wav#t=0,1.882" at="23.000" volume="1"></audio>
  <audio id="vo-09" src="assets/audio/shot-09.wav#t=0,1.822" at="26.000" volume="1"></audio>
</section>

<section>
  <audio id="music" src="assets/audio/drone.wav#t=0,30" at="0" volume="0.24"></audio>
</section>

</body>
</html>
